extent.reporter.spark.start=true
extent.reporter.spark.out=target/ExtentReports/SparkReport/Index.html
screenshot.dir=target/screenshots/
screenshot.rel.path=../screenshots/

# 2. UI Theme & Custom Styling Customization
extent.reporter.spark.config.theme=dark
extent.reporter.spark.config.documentTitle=Automation Test Execution Report
extent.reporter.spark.config.reportName=Regression Suite Results

extent.reporter.bdd.start=true
# 1. Force the adapter to strictly map BDD lifecycle statuses
extent.reporter.bdd.start=true

# 2. Tell the adapter to visually track skipped and pending steps
extent.reporter.spark.vieworder=dashboard,test,exception,category

# 3. Explicitly tell the system how to handle skipped statuses (Crucial)
extent.reporter.spark.config.transit.skipped=true
extent.reporter.spark.config.transit.pending=true

# Inject framework configuration details dynamically into the report UI
systeminfo.Environment=Staging
systeminfo.OS=Windows 11
systeminfo.QA_Engineer=Automation_Bot